StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = Base

Packages = Google

[*.md]
BasedOnStyles = Vale, Google

# Em-dashes with surrounding spaces are a deliberate typographic choice
# in this codebase. Google's style disallows them; we don't.
Google.EmDash = NO

# Vale.Terms enforces vocab entries as canonical forms, which conflicts
# with our use of vocab for case-insensitive spelling acceptance only.
Vale.Terms = NO

# Google.Headings false-positives on proper nouns (GitHub, kolohelios-bot)
# that legitimately appear mid-heading in this repo's docs.
Google.Headings = NO

# Test fixtures contain deliberately malformed or sample prose; templates
# contain placeholder syntax. Disable prose linting for these.
[**/tests/fixtures/**/*.md]
BasedOnStyles =

[**/templates/**/*.md]
BasedOnStyles =
