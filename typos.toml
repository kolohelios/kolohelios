[files]
extend-exclude = [
  "**/target/",
  "**/result/",
  "*.lock",
  "**/*.lock",
  # Vendored third-party JS minified bundles trip the typos
  # check on mangled identifiers (e.g. `pn`, `ue`). The bytes
  # are authoritative from upstream; don't scan them.
  "**/vendor/*.min.js",
]

[default.extend-words]
# Add false-positive overrides as they're discovered. Keep entries
# justified with a brief comment so future readers know why each one is
# pinned.
AKS = "AKS" # Azure Kubernetes Service
