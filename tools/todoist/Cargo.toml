[package]
edition = "2021"
license = "MIT OR Apache-2.0"
name    = "todoist"
publish = false
version = "0.1.0"

[[bin]]
name = "todoist"
path = "src/main.rs"

[dependencies]
anyhow     = "1"
clap       = { version = "4", features = ["derive"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "0.8"
ureq       = { version = "2", features = ["json"] }

[dev-dependencies]
tempfile = "3"

[lints.clippy]
mod_module_files = "deny"
