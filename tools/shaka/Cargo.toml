[package]
edition      = "2021"
license      = "MIT OR Apache-2.0"
name         = "shaka"
publish      = false
rust-version = "1.95"
version      = "0.1.0"

[[bin]]
name = "shaka"
path = "src/main.rs"

[dependencies]
chrono        = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap          = { version = "4", features = ["derive"] }
clap_complete = "4"
hcl-edit      = "0.10"
indexmap      = { version = "2", features = ["serde"] }
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
# Maintained YAML fork; retain the import name to avoid unrelated API churn.
serde_yaml_ng = { package = "yaml_serde", version = "0.10.7" }
shlex         = "2"
snafu         = "0.9"
tempfile      = "3"

[lints.clippy]
mod_module_files = "deny"
