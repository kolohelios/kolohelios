[package]
edition = "2021"
license = "MIT OR Apache-2.0"
name    = "shaka"
publish = false
version = "0.1.0"

[[bin]]
name = "shaka"
path = "src/main.rs"

[dependencies]
clap          = { version = "4", features = ["derive"] }
clap_complete = "4"
hcl-edit      = "0.9"
indexmap      = { version = "2", features = ["serde"] }
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
serde_yaml_ng = "0.10"
shlex         = "2"
snafu         = "0.9"
tempfile      = "3"

[lints.clippy]
mod_module_files = "deny"
