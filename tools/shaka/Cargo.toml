[package]
name = "shaka"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[[bin]]
name = "shaka"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
hcl-edit = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snafu = "0.9"
tempfile = "3"
