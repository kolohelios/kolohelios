[package]
edition      = "2021"
license      = "MIT OR Apache-2.0"
name         = "claude-hooks"
publish      = false
rust-version = "1.95"
version      = "0.1.0"

[[bin]]
name = "claude-hooks"
path = "src/main.rs"

[dependencies]
clap          = { version = "4", features = ["derive"] }
clap_complete = "4"
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
shlex         = "1"

[lints.clippy]
mod_module_files = "deny"
