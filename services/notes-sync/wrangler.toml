compatibility_date = "2026-05-14"
main               = "build/worker/shim.mjs"
name               = "notes-sync"

# `worker-build` produces `build/worker/shim.mjs` and the wasm module
# wrangler uploads. The build runs upstream of `wrangler deploy` (in
# CI: a dedicated step in `cf-deploy.yml`; locally: same command in
# the devshell). Wrangler is invoked with the artifact already in
# place — no `[build]` block, no custom build subprocess. See #403 /
# #423 for why the build is pulled out of the wrangler subprocess: a
# wrangler-spawned build resolves `rustc` from a toolchain without the
# `wasm32-unknown-unknown` target and fails.

# Durable Object bindings: one per-note object (`NOTE`, the single writer
# and source of truth), and one per-OAuth-flow object (`AUTH_FLOW`, keyed
# by the `state` value, holding the PKCE verifier + DPoP key between login
# and callback).
[durable_objects]
bindings = [
  { name = "NOTE", class_name = "NoteDurableObject" },
  { name = "AUTH_FLOW", class_name = "AuthFlow" },
]

# SQLite-backed storage for the Durable Object classes. The SQLite backend
# is what the append-only edit log (phase 2) is built on; classes opt in
# at creation time. Migrations are append-only by tag.
[[migrations]]
new_sqlite_classes = ["NoteDurableObject"]
tag                = "v1"

[[migrations]]
new_sqlite_classes = ["AuthFlow"]
tag                = "v2"

# Cold-tier git target (phase 3). The Durable Object commits each note's
# body to `notes/<note_id>.md` in this repo on the lazy debounce/backstop
# cadence. Non-secret, so it lives here.
#
# The commit credential is a static server-side secret (a GitHub App
# installation token or a PAT) — unrelated to user login. Set it out of
# band, never in this file:
#   wrangler secret put GITHUB_TOKEN
#
# Auth (phase 4): `OAUTH_BASE_URL` is this backend Worker's public origin
# — the client_id is `<OAUTH_BASE_URL>/client-metadata.json` and the
# redirect is `<OAUTH_BASE_URL>/oauth/callback`, so it must match the
# deployed hostname. `OAUTH_APP_URL` is the front end (notes-web); the
# callback redirects there after minting the cookie. Both are
# `*.kolohelios.com`, so the host-only session cookie is same-site and
# rides the WebSocket back to this Worker. `OAUTH_HANDLE_RESOLVER`
# (optional) is the appview used to resolve a handle to a DID. The
# cookie-signing key is a secret:
#   wrangler secret put SESSION_SECRET
#
# `OWNER_DID` is the single account allowed to reach a note socket: the WS
# gate authorizes only a session cookie carrying this DID, so authn-only
# OAuth (any Bluesky account) can't read or write the notes. A DID is a
# public identifier, not a secret. `did:plc:ujhuvzz7wulwh7kkxcshwwrf` is
# `kolohelios.bsky.social`.
[vars]
GITHUB_BRANCH         = "main"
GITHUB_OWNER          = "kolohelios"
GITHUB_REPO           = "notes-store"
OAUTH_APP_URL         = "https://notes.kolohelios.com"
OAUTH_BASE_URL        = "https://notes-sync.kolohelios.com"
OAUTH_HANDLE_RESOLVER = "https://bsky.social"
OWNER_DID             = "did:plc:ujhuvzz7wulwh7kkxcshwwrf"
