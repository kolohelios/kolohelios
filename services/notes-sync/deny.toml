[advisories]
unmaintained = "all"
version      = 2

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
]
private = { ignore = true }
version = 2

[bans]
multiple-versions = "warn"
wildcards         = "deny"
# The `notes-protocol` sibling is a path dependency with no version
# (it's unpublished, consumed in-repo). That's a legitimate wildcard;
# allow it for path deps only, keeping the deny for registry crates.
allow-wildcard-paths = true

[sources]
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
unknown-git      = "deny"
unknown-registry = "deny"
