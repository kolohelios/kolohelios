# Run `shaka ci generate-workflows` to refresh.
#
# Source of truth: <slot>/<project>/project.cue.

name: notes-sync cleanup
on:
  pull_request:
    types:
    - closed
permissions:
  id-token: write
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
    steps:
    - name: verify OP_SERVICE_ACCOUNT_TOKEN
      run: |
        if [[ -z "$OP_SERVICE_ACCOUNT_TOKEN" ]]; then
          echo "::error::OP_SERVICE_ACCOUNT_TOKEN is empty; check repo/org secret"
          exit 1
        fi
    - uses: actions/checkout@v7
    - uses: DeterminateSystems/nix-installer-action@main
      with:
        determinate: true
        flakehub: true
    - uses: DeterminateSystems/flakehub-cache-action@v3
    - name: wrangler delete preview Worker
      run: |
        cd services/notes-sync
        cp .env.example .env
        nix develop . --command op run --env-file=.env -- \
          wrangler delete \
          --name notes-sync-pr-${{ github.event.pull_request.number }} \
          --force \
          || true
