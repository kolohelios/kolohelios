# Reusable `tofu apply` workflow for `infra/*` projects.
#
# Caller (per-project workflow under #343) passes the project directory
# and the 1Password Service Account token. The SA token lets `op run`
# resolve every `op://` reference in the project's `.env` (Cloudflare
# token, Linode S3 creds for remote tfstate, etc.) so `just apply`
# authenticates the same way it does locally.
#
# Apply runs non-interactively via `just apply -auto-approve
# -input=false`; the generated recipe already wraps `tofu apply` in
# `op run --env-file=.env -- bash -c '...'` and inits before applying,
# so this workflow stays thin.
#
# Wrapped in `shaka ci mask-and-run` so each op-resolved value
# (CLOUDFLARE_API_TOKEN, the S3 creds for tfstate, etc.) is registered
# with GH Actions log masking before any consumer runs — `tofu apply`
# error context that echoes a sensitive value still shows as `***`.
# The recipe's own inner `op run` is harmless redundancy; keeping the
# wrapper at the outermost layer leaves local `just apply` unchanged.
name: tf-apply

on:
  workflow_call:
    inputs:
      project_dir:
        description: "Path to the infra project (e.g. infra/cloudflare-deploy)"
        required: true
        type: string
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN:
        description: "1Password Service Account token used by `op run` to resolve `.env` references"
        required: true

jobs:
  apply:
    name: tofu apply
    runs-on: ubuntu-latest
    permissions:
      # nix-installer-action mints an OIDC token to authenticate with
      # FlakeHub for the `kolohelios-nix` private input.
      id-token: write
      contents: read
    env:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: true
          flakehub: true
      - uses: DeterminateSystems/flakehub-cache-action@v3
      - name: tofu apply
        working-directory: ${{ inputs.project_dir }}
        # `.env` is gitignored; copy from the in-repo example so the
        # recipe's `_env-check` precondition passes. `.env.example`
        # already holds the `op://` refs the SA token will resolve.
        #
        # `--retry-on "This Worker does not exist"` absorbs the
        # first-deploy race (#714): on a brand-new `rust-worker`, the
        # `cloudflare_workers_custom_domain` attach in this apply runs
        # concurrently with the project's `wrangler deploy`, and on a
        # script that doesn't exist yet Cloudflare rejects the attach
        # with that message. `tofu apply` is idempotent, so re-running
        # self-heals once the parallel deploy lands the script. The
        # retry rides along on every infra project that calls this
        # reusable workflow (cloudflare-dns, cloudflare-tokens), but the
        # substring only ever matches the worker-domain race, so it's a
        # no-op elsewhere.
        run: |
          cp .env.example .env
          nix develop . --command shaka ci mask-and-run --env-file=.env \
            --retry-on "This Worker does not exist" --max-retries 5 --retry-delay 30 -- \
            just apply -auto-approve -input=false
