name: Terraform

on:
  pull_request:
    paths:
      - "infra/devbox/terraform/**"
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply

env:
  TF_WORKING_DIR: infra/devbox/terraform

jobs:
  plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    env:
      TF_VAR_linode_token: ${{ secrets.LINODE_TOKEN }}
      TF_VAR_root_pass: ${{ secrets.DEVBOX_ROOT_PASS }}
      TF_VAR_image_id: ${{ vars.DEVBOX_IMAGE_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.9"

      - run: terraform init
      - run: terraform validate
      - run: terraform plan -out=tfplan

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 3

  apply:
    name: Terraform apply
    needs: plan
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    env:
      TF_VAR_linode_token: ${{ secrets.LINODE_TOKEN }}
      TF_VAR_root_pass: ${{ secrets.DEVBOX_ROOT_PASS }}
      TF_VAR_image_id: ${{ vars.DEVBOX_IMAGE_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.9"

      - uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}

      - run: terraform init
      - run: terraform apply tfplan
