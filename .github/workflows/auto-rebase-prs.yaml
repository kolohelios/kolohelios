name: Auto-rebase PRs

# When main moves, rebase every open PR whose base is `main` onto the new
# tip. Conflicts surface as a failing `auto-rebase` commit status on the PR
# head; the workflow run goes red so the failure is visible in the Actions
# UI as well. PRs labeled `do-not-rebase` are skipped.
#
# Authenticates as the kolohelios-bot GitHub App so force-push and status
# posting bypass the GITHUB_TOKEN's contents-write/checks-write limits and
# (more importantly) so post-rebase pushes re-trigger CI on each PR — which
# pushes via the default GITHUB_TOKEN do not.
on:
  push:
    branches: [main]
  # Manual trigger from the Actions UI — useful for verifying the App
  # install or a rotated private key without waiting for main to move
  # organically.
  workflow_dispatch:

# A second push to main that lands while we're rebasing makes the in-flight
# run stale — its rebases would target an out-of-date base. Cancel it; the
# new run will pick up every PR that still needs attention.
concurrency:
  group: auto-rebase-prs
  cancel-in-progress: true

jobs:
  rebase:
    runs-on: ubuntu-latest
    # `id-token: write` lets DeterminateSystems/nix-installer-action mint an
    # OIDC token for FlakeHub — `nix run ./tools/shaka` substitutes the
    # wrapped shaka closure from FlakeHub Cache (published by the
    # `build-shaka` job in `main.yaml`) and fails without the token.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.KOLOHELIOS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.KOLOHELIOS_BOT_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: true
          flakehub: true
      - uses: DeterminateSystems/flakehub-cache-action@v3
      - name: Configure git identity for rebase commits
        # The numeric App ID (3591292) is part of GitHub's noreply email
        # format `<app-id>+<bot-name>[bot]@users.noreply.github.com`,
        # which is what makes commits attributable to the App. The Client
        # ID (used above for token minting) doesn't fit this slot.
        run: |
          git config --global user.name 'kolohelios-bot[bot]'
          git config --global user.email '3591292+kolohelios-bot[bot]@users.noreply.github.com'
      - name: Rebase open PRs
        run: nix run ./tools/shaka -- repo rebase-open-prs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
