name: Bump kolohelios-nix locks

# Daily bump of the `kolohelios-nix` flake input across every consumer
# (`apps/blogctl`, `infra/devbox`, `tools/shaka`). When at least one
# consumer's lock changes, opens a single lockstep PR (`bot/bump-kolohelios-nix`).
# If a PR is already open for that branch, force-pushes fresher locks
# onto it instead of opening a duplicate. No auto-merge.
#
# All branch / commit / push / PR-or-update logic lives in
# `shaka repo bump-locks --pr-branch <name>`. This workflow is the thin
# scheduler that calls it with the right credentials.
#
# Authenticates as the `kolohelios-bot` GitHub App so the resulting push
# re-triggers the PR's normal CI (which pushes via the default
# `GITHUB_TOKEN` do not).
on:
  schedule:
    # 00:00 UTC daily. Picks up new `kolohelios-nix` releases ≤24h after
    # publish.
    - cron: "0 0 * * *"
  # Manual trigger for ad-hoc bumps and verification after rotating the
  # bot's credentials.
  workflow_dispatch:

# A second invocation that lands while we're still bumping would race on
# the bot branch. Cancel any in-flight run; the new one will see the
# latest state.
concurrency:
  group: bump-kolohelios-nix
  cancel-in-progress: true

jobs:
  bump:
    runs-on: ubuntu-latest
    # `id-token: write` lets DeterminateSystems/nix-installer-action mint
    # an OIDC token for FlakeHub. `nix run ./tools/shaka` substitutes the
    # wrapped shaka closure from FlakeHub Cache (published by the
    # `build-shaka` job in `main.yaml`); `nix flake update kolohelios-nix`
    # called by shaka itself also needs the token to fetch the private
    # `kolohelios-nix` flake.
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.KOLOHELIOS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.KOLOHELIOS_BOT_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: true
          flakehub: true
      - uses: DeterminateSystems/flakehub-cache-action@v3
      - name: Configure git identity
        # The numeric App ID (3591292) is part of GitHub's noreply email
        # format `<app-id>+<bot-name>[bot]@users.noreply.github.com`,
        # which is what makes commits attributable to the App. The Client
        # ID (used above for token minting) doesn't fit this slot.
        run: |
          git config --global user.name 'kolohelios-bot[bot]'
          git config --global user.email '3591292+kolohelios-bot[bot]@users.noreply.github.com'
      - name: Bump kolohelios-nix and open or update PR
        run: |
          nix run ./tools/shaka -- repo bump-locks \
            --input kolohelios-nix \
            --pr-branch bot/bump-kolohelios-nix
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
