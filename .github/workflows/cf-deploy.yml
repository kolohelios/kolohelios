# Reusable `wrangler deploy` workflow for `rust-worker` apps.
#
# Caller (per-project workflow, e.g. `kolohelios-portfolio-deploy.yml`)
# passes the project directory and the 1Password Service Account
# token. The SA token lets `op run` resolve every `op://` reference
# in the project's `.env` (CF deploy token, account id, etc.) so
# `wrangler deploy` authenticates the same way it does locally.
# Mirrors `tf-apply.yml`'s shape — one input, one secret, the
# project's `.env.example` is the source of truth for what resolves.
#
# `verify_only: true` toggles dry-run mode: `wrangler deploy
# --dry-run` exercises the full credential chain (SA token, vault
# permissions, `op://` resolution, CF API auth, account/scope
# checks) plus the build (wasm compile, `wrangler.toml`
# validation), but skips the actual upload. Use this from PR
# triggers so credential rot, stale `op://` refs, expired tokens,
# or misconfigured Worker scripts fail pre-merge instead of
# surfacing after the first real `push: main` deploy. The only
# failure modes that slip past dry-run are apply-time CF API
# outages and the literal upload itself.
#
# `script_name_override: <name>` deploys to that Worker script
# name instead of the one in `wrangler.toml`. Use for PR preview
# deploys — pair with a name like `<project>-pr-${{ pr.number }}`
# so each PR gets its own ephemeral Worker (cleanup is the
# caller's responsibility, typically a `pull_request: closed`
# job that runs `wrangler delete`). Output `worker_url` exposes
# the deployed URL (the `*.workers.dev` URL, or the custom domain for
# a custom-domain-only Worker) so the caller can post / update a PR
# comment without re-parsing wrangler output itself.
#
# Threat-model assumptions (worth revisiting if any of these change):
#
#   - This workflow is invoked only via `workflow_call` from callers
#     triggered by `push: main` (real deploys) or `pull_request`
#     with `verify_only: true` (dry-run preflights). Fork PRs can't
#     reach `main`; same-repo PRs receive secrets by default. If
#     callers ever trigger from fork PRs without secret gating, the
#     SA token's blast radius is the whole 1Password vault.
#   - Third-party actions below are tag-pinned; SHA pinning is a
#     known gap tracked in #377.
#   - Child secrets resolved by `op run` (e.g. CLOUDFLARE_API_TOKEN)
#     are not auto-masked by GH Actions — only the SA token itself is.
#     `shaka ci mask-and-run` registers them with `::add-mask::` before
#     execing the consumer, so any value op resolves shows as `***` in
#     the log even if a consumer prints it.
#
# Declared Worker runtime secrets (each project's `wrangler.secrets`)
# are pushed after the deploy by `shaka ci push-worker-secrets`, run
# under the same `mask-and-run` + SA-token mechanism as the deploy: it
# reads each secret's value from the resolved `.env` and pipes it to
# the idempotent `wrangler secret put`. Skipped in `verify_only` mode.
# See the `push Worker runtime secrets` step below (#794).
name: cf-deploy

on:
  workflow_call:
    inputs:
      project_dir:
        description: "Path to the rust-worker app (e.g. apps/kolohelios-portfolio)"
        required: true
        type: string
      worker_build_dir:
        description: "Subdir of project_dir to run worker-build in (the Cargo-workspace member crate holding the Worker cdylib). Empty = project_dir."
        required: false
        type: string
        default: ""
      verify_only:
        description: "If true, run `wrangler deploy --dry-run` instead of the real deploy. Use from PR triggers as a pre-merge credential and config check."
        required: false
        type: boolean
        default: false
      script_name_override:
        description: "If non-empty, deploys to this Worker script name instead of the one in wrangler.toml (via wrangler --name). Use for PR preview deploys; caller is responsible for cleanup."
        required: false
        type: string
        default: ""
      environment:
        description: "If non-empty, append `--env <environment>` to wrangler deploy so a named wrangler.toml environment (e.g. production) is used. Lets a prod-only custom_domain route live under `[env.production]` while route-free verifies/previews stay on *.workers.dev. Unset = top-level config, today's behavior."
        required: false
        type: string
        default: ""
      pre_build_command:
        description: "If non-empty, a shell command run (cwd = project_dir, with nix on PATH) before worker-build in every mode. Use to stage build artifacts produced by another project into this Worker's asset directory (the command picks its own devshell, e.g. `nix develop ../other`). Empty = skip."
        required: false
        type: string
        default: ""
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN:
        description: "1Password Service Account token used by `op run` to resolve `.env` references"
        required: true
    outputs:
      worker_url:
        description: "The URL the Worker was deployed to — its *.workers.dev URL, or the custom domain for a custom-domain-only Worker. Empty in verify_only mode."
        value: ${{ jobs.deploy.outputs.worker_url }}

jobs:
  deploy:
    name: ${{ inputs.verify_only && 'wrangler deploy (dry-run)' || 'wrangler deploy' }}
    runs-on: ubuntu-latest
    permissions:
      # nix-installer-action mints an OIDC token to authenticate with
      # FlakeHub for the `kolohelios-nix` private input.
      id-token: write
      contents: read
    env:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
    outputs:
      worker_url: ${{ steps.parse-url.outputs.worker_url }}
    steps:
      - name: verify OP_SERVICE_ACCOUNT_TOKEN
        # `required: true` above catches "caller didn't pass it";
        # this catches "caller passed an empty value" (e.g. the org
        # secret is unset). Fail fast with a clear annotation so the
        # downstream `op run` doesn't surface a cryptic error.
        run: |
          if [[ -z "$OP_SERVICE_ACCOUNT_TOKEN" ]]; then
            echo "::error::OP_SERVICE_ACCOUNT_TOKEN is empty; check the caller workflow and repo/org secret"
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: true
          flakehub: true
      - uses: DeterminateSystems/flakehub-cache-action@v3
      - name: cf-deploy shaka
        # Run the deploy-orchestration `shaka ci` steps below with a shaka
        # THIS reusable workflow controls, not the version the consumer
        # pins in its devshell. `cf-deploy.yml@main` keeps adding `shaka ci`
        # subcommands as it evolves (`mask-and-run`, `parse-deploy-url`,
        # `push-worker-secrets`); resolving them from the consumer's pin
        # made every cf-deploy change silently break a consumer's deploy
        # until it bumped shaka — and only at deploy time, since `verify`
        # skips the newer steps (#912). shaka and cf-deploy publish from the
        # same `main`, so the latest FlakeHub `shaka` is always at least as
        # new as `cf-deploy.yml@main` needs. The app toolchain
        # (`worker-build`, `wrangler`, `op`) stays consumer-pinned via the
        # devshell — only the CI glue is decoupled; the steps below prepend
        # `$CFDEPLOY_SHAKA` to `$PATH` inside `nix develop` so `shaka` is
        # this version while everything else stays the consumer's.
        run: |
          out=$(nix build --no-link --print-out-paths \
            "https://flakehub.com/f/kolohelios/shaka/*.tar.gz")
          echo "CFDEPLOY_SHAKA=$out/bin" >> "$GITHUB_ENV"
      - name: pre-build assets
        # Stage build artifacts produced by *another* project into this
        # Worker's asset directory before `worker-build`/`wrangler deploy`.
        # E.g. notes-web builds the notes-editor WASM bundle into
        # `dist/editor/` here so `[assets]` ships it. The command picks
        # its own devshell (only `nix` is guaranteed on PATH) — typically
        # `nix develop ../<other> --command ...` — because the artifact's
        # toolchain lives in *its* flake, not this project's. Runs in
        # every mode (verify/preview/deploy) so a broken cross-project
        # build fails the PR verify, not just the production deploy.
        #
        # Passed via `env` and run through `bash -c "$VAR"` rather than
        # interpolated into `run:` directly, so the command can't be a
        # workflow-expression injection vector.
        if: ${{ inputs.pre_build_command != '' }}
        working-directory: ${{ inputs.project_dir }}
        env:
          PRE_BUILD_COMMAND: ${{ inputs.pre_build_command }}
        run: bash -c "$PRE_BUILD_COMMAND"
      - name: worker-build
        working-directory: ${{ inputs.project_dir }}
        # Build the worker upstream of `wrangler deploy` so the wasm
        # build runs inside our devshell, not inside a subprocess
        # wrangler spawns with a different `$PATH`. `wasm-pack`'s
        # wasm-target probe does `which("rustc")` against `$PATH`;
        # in CI a wrangler-spawned subprocess was somehow resolving
        # a rustc outside our declared closure and failing the probe
        # (#403). Pulling the build out of wrangler keeps everything
        # in a `$PATH` we control. See `wrangler.toml`'s top-of-file
        # comment + #423.
        #
        # `worker-build` comes from the devshell (nixpkgs-pinned) rather
        # than a floating `cargo install`, so its wasm-bindgen minimum
        # can't drift by runner cache (#864).
        #
        # `worker-build` requires a `[package]` manifest in its CWD. When
        # the project is a Cargo workspace, `project_dir/Cargo.toml` is a
        # virtual manifest with no `[package]`, so `cd` into the member
        # crate holding the Worker cdylib first. The devshell still
        # resolves at `project_dir` (`nix develop .`); only the build CWD
        # moves. `WORKER_BUILD_DIR` unset/empty → `.` = `project_dir`, so
        # single-crate consumers build unchanged (#890).
        run: |
          # shellcheck disable=SC2016  # ${WORKER_BUILD_DIR} is expanded by the inner bash -c, not this shell — single quotes are intentional
          nix develop . --command bash -c 'cd "${WORKER_BUILD_DIR:-.}" && worker-build --release'
        env:
          WORKER_BUILD_DIR: ${{ inputs.worker_build_dir }}
      - name: wrangler deploy${{ inputs.verify_only && ' (dry-run)' || '' }}
        id: wrangler
        working-directory: ${{ inputs.project_dir }}
        # `.env` is gitignored; copy from the in-repo example so the
        # `op run` invocation finds the file. `.env.example` already
        # holds the `op://` refs the SA token will resolve.
        #
        # `--dry-run` (verify_only mode) runs everything `wrangler
        # deploy` would do except the final upload: `wrangler.toml`
        # validation, CF API authentication, account and scope
        # checks, asset upload prep. The wasm build already ran in
        # the previous step.
        #
        # `--name <override>` (script_name_override mode) deploys to
        # an alternate Worker name without touching `wrangler.toml`.
        #
        # `--env <environment>` (environment mode) selects a named
        # `[env.<name>]` section of `wrangler.toml`. Use it so a
        # prod-only `custom_domain` route lives under `[env.production]`
        # while the route-free top-level config serves verifies and PR
        # previews — keeping the production domain off throwaway preview
        # Workers. Unset selects the top-level config (today's behavior).
        #
        # `tee` mirrors stdout to a file so the URL parser in the
        # next step can grep it without re-running wrangler.
        run: |
          cp .env.example .env
          # shellcheck disable=SC2016  # $CFDEPLOY_SHAKA expands in the inner bash -c, not this shell — single quotes are intentional
          nix develop . --command bash -c '
            export PATH="$CFDEPLOY_SHAKA:$PATH"
            exec shaka ci mask-and-run --env-file=.env -- \
              wrangler deploy \
              ${{ inputs.verify_only && '--dry-run' || '' }} \
              ${{ inputs.script_name_override && format('--name {0}', inputs.script_name_override) || '' }} \
              ${{ inputs.environment && format('--env {0}', inputs.environment) || '' }}
          ' 2>&1 | tee /tmp/wrangler-output.log
          # `tee` masks the inner exit code; restore it explicitly.
          exit "${PIPESTATUS[0]}"
      - name: push Worker runtime secrets
        working-directory: ${{ inputs.project_dir }}
        # Now that the Worker exists, push every secret declared in the
        # project's `wrangler.secrets` from its `op://` reference. The
        # `.env` written by the deploy step above still holds the refs.
        # Run under `mask-and-run` so each resolved value lands a
        # `::add-mask::` before `wrangler secret put` touches it, and so
        # the same SA token resolves the refs. `wrangler secret put` is
        # idempotent, so an unchanged re-deploy is a no-op.
        #
        # Skipped in verify_only mode — a dry-run uploads nothing, so
        # there's no Worker to attach secrets to. `--name`/`--environment`
        # mirror the deploy's targeting so the secret lands on the same
        # Worker: preview scripts (`--name`) get the key too, so their
        # submit paths work, not just the production Worker.
        if: ${{ ! inputs.verify_only }}
        run: |
          # shellcheck disable=SC2016  # $CFDEPLOY_SHAKA expands in the inner bash -c, not this shell — single quotes are intentional
          nix develop . --command bash -c '
            export PATH="$CFDEPLOY_SHAKA:$PATH"
            exec shaka ci mask-and-run --env-file=.env -- \
              shaka ci push-worker-secrets \
              ${{ inputs.script_name_override && format('--name {0}', inputs.script_name_override) || '' }} \
              ${{ inputs.environment && format('--environment {0}', inputs.environment) || '' }}
          '
      - name: parse worker URL
        id: parse-url
        working-directory: ${{ inputs.project_dir }}
        # Skipped in verify-only mode; nothing was deployed, no URL to
        # extract. `shaka ci parse-deploy-url` prefers the
        # `*.workers.dev` URL but falls back to a `<host> (custom domain)`
        # trigger line — a Worker with a `custom_domain` route disables
        # the workers.dev URL by default, so a clean custom-domain-only
        # deploy prints no workers.dev line (#867). It exits non-zero only
        # when neither shape is present (a genuine wrangler format change);
        # that turns into the error annotation below rather than a silent
        # empty URL.
        if: ${{ ! inputs.verify_only }}
        run: |
          # shellcheck disable=SC2016  # $CFDEPLOY_SHAKA expands in the inner bash -c, not this shell — single quotes are intentional
          if ! url=$(nix develop . --command bash -c '
            export PATH="$CFDEPLOY_SHAKA:$PATH"
            exec shaka ci parse-deploy-url /tmp/wrangler-output.log'); then
            echo "::error::could not parse worker URL from wrangler output (format change?)"
            exit 1
          fi
          echo "worker_url=$url" >> "$GITHUB_OUTPUT"
