# Reusable `wrangler deploy` workflow for `rust-worker` apps.
#
# Caller (per-project workflow, e.g. `kolohelios-portfolio-deploy.yml`)
# passes the project directory and the 1Password Service Account
# token. The SA token lets `op run` resolve every `op://` reference
# in the project's `.env` (CF deploy token, account id, etc.) so
# `wrangler deploy` authenticates the same way it does locally.
# Mirrors `tf-apply.yml`'s shape — one input, one secret, the
# project's `.env.example` is the source of truth for what resolves.
#
# `verify_only: true` toggles dry-run mode: `wrangler deploy
# --dry-run` exercises the full credential chain (SA token, vault
# permissions, `op://` resolution, CF API auth, account/scope
# checks) plus the build (wasm compile, `wrangler.toml`
# validation), but skips the actual upload. Use this from PR
# triggers so credential rot, stale `op://` refs, expired tokens,
# or misconfigured Worker scripts fail pre-merge instead of
# surfacing after the first real `push: main` deploy. The only
# failure modes that slip past dry-run are apply-time CF API
# outages and the literal upload itself.
#
# `script_name_override: <name>` deploys to that Worker script
# name instead of the one in `wrangler.toml`. Use for PR preview
# deploys — pair with a name like `<project>-pr-${{ pr.number }}`
# so each PR gets its own ephemeral Worker (cleanup is the
# caller's responsibility, typically a `pull_request: closed`
# job that runs `wrangler delete`). Output `worker_url` exposes
# the `*.workers.dev` URL so the caller can post / update a PR
# comment without re-parsing wrangler output itself.
#
# Threat-model assumptions (worth revisiting if any of these change):
#
#   - This workflow is invoked only via `workflow_call` from callers
#     triggered by `push: main` (real deploys) or `pull_request`
#     with `verify_only: true` (dry-run preflights). Fork PRs can't
#     reach `main`; same-repo PRs receive secrets by default. If
#     callers ever trigger from fork PRs without secret gating, the
#     SA token's blast radius is the whole 1Password vault.
#   - Third-party actions below are tag-pinned; SHA pinning is a
#     known gap tracked in #377.
#   - Child secrets resolved by `op run` (e.g. CLOUDFLARE_API_TOKEN)
#     are not auto-masked by GH Actions — only the SA token itself is.
#     `shaka ci mask-and-run` registers them with `::add-mask::` before
#     execing the consumer, so any value op resolves shows as `***` in
#     the log even if a consumer prints it.
#
# `wrangler secret put` for declared Worker runtime secrets is not
# implemented in v1 — portfolio has none today, and the idempotence
# story belongs in a separate issue when there's a real consumer.
name: cf-deploy

on:
  workflow_call:
    inputs:
      project_dir:
        description: "Path to the rust-worker app (e.g. apps/kolohelios-portfolio)"
        required: true
        type: string
      verify_only:
        description: "If true, run `wrangler deploy --dry-run` instead of the real deploy. Use from PR triggers as a pre-merge credential and config check."
        required: false
        type: boolean
        default: false
      script_name_override:
        description: "If non-empty, deploys to this Worker script name instead of the one in wrangler.toml (via wrangler --name). Use for PR preview deploys; caller is responsible for cleanup."
        required: false
        type: string
        default: ""
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN:
        description: "1Password Service Account token used by `op run` to resolve `.env` references"
        required: true
    outputs:
      worker_url:
        description: "The *.workers.dev URL the Worker was deployed to. Empty in verify_only mode."
        value: ${{ jobs.deploy.outputs.worker_url }}

jobs:
  deploy:
    name: ${{ inputs.verify_only && 'wrangler deploy (dry-run)' || 'wrangler deploy' }}
    runs-on: ubuntu-latest
    permissions:
      # nix-installer-action mints an OIDC token to authenticate with
      # FlakeHub for the `kolohelios-nix` private input.
      id-token: write
      contents: read
    env:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
    outputs:
      worker_url: ${{ steps.parse-url.outputs.worker_url }}
    steps:
      - name: verify OP_SERVICE_ACCOUNT_TOKEN
        # `required: true` above catches "caller didn't pass it";
        # this catches "caller passed an empty value" (e.g. the org
        # secret is unset). Fail fast with a clear annotation so the
        # downstream `op run` doesn't surface a cryptic error.
        run: |
          if [[ -z "$OP_SERVICE_ACCOUNT_TOKEN" ]]; then
            echo "::error::OP_SERVICE_ACCOUNT_TOKEN is empty; check the caller workflow and repo/org secret"
            exit 1
          fi
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: true
          flakehub: true
      - uses: DeterminateSystems/flakehub-cache-action@v3
      - name: wrangler deploy${{ inputs.verify_only && ' (dry-run)' || '' }}
        id: wrangler
        working-directory: ${{ inputs.project_dir }}
        # `.env` is gitignored; copy from the in-repo example so the
        # `op run` invocation finds the file. `.env.example` already
        # holds the `op://` refs the SA token will resolve.
        #
        # `--dry-run` (verify_only mode) runs everything `wrangler
        # deploy` would do except the final upload: wasm build,
        # `wrangler.toml` validation, CF API authentication, account
        # and scope checks. Strictly stronger than a bare `op run
        # -- true` credential probe.
        #
        # `--name <override>` (script_name_override mode) deploys to
        # an alternate Worker name without touching `wrangler.toml`.
        # `tee` mirrors stdout to a file so the URL parser in the
        # next step can grep it without re-running wrangler.
        run: |
          cp .env.example .env
          nix develop . --command shaka ci mask-and-run --env-file=.env -- \
            wrangler deploy \
            ${{ inputs.verify_only && '--dry-run' || '' }} \
            ${{ inputs.script_name_override && format('--name {0}', inputs.script_name_override) || '' }} \
            2>&1 | tee /tmp/wrangler-output.log
          # `tee` masks the inner exit code; restore it explicitly.
          exit "${PIPESTATUS[0]}"
      - name: parse worker URL
        id: parse-url
        # Skipped in verify-only mode; nothing was deployed, no URL
        # to extract. Grep the first `https://*.workers.dev` line
        # from wrangler stdout — stable across recent wrangler
        # versions; if the format ever shifts, this step fails the
        # job rather than silently emitting an empty URL.
        if: ${{ ! inputs.verify_only }}
        run: |
          url=$(grep -oE 'https://[^[:space:]]+\.workers\.dev' /tmp/wrangler-output.log | head -1)
          if [[ -z "$url" ]]; then
            echo "::error::could not parse worker URL from wrangler output (format change?)"
            exit 1
          fi
          echo "worker_url=$url" >> "$GITHUB_OUTPUT"
