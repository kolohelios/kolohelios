# Hand-authored workflow (NOT generated by `shaka ci generate-workflows`).
# Listed in `tools/shaka/src/ci/audit_workflows.rs::HAND_AUTHORED`.
#
# Builds `infra/home`'s `darwinConfigurations.Jons-MacBook-Pro.system`
# on `macos-latest` so the closure populates FlakeHub Cache. Without
# this, cold-bootstrap of nix-darwin on a fresh aarch64-darwin host
# has to compile every uncached derivation locally, which OOMs on
# direnv's fish-test phase (see #279).
#
# A follow-up will extend `shaka ci generate-workflows` to express
# per-platform builds via `project.cue`, at which point this file
# becomes generated and can leave the audit allowlist.

name: Build infra/home (darwin)

on:
  pull_request:
    paths:
      - 'infra/home/**'
      - '.github/workflows/home-build-darwin.yaml'
  push:
    branches:
      - main
    paths:
      - 'infra/home/**'
      - '.github/workflows/home-build-darwin.yaml'

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build infra/home (darwin)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: true
          flakehub: true
      - uses: DeterminateSystems/flakehub-cache-action@v3.21.8
      - name: Build darwinConfigurations.Jons-MacBook-Pro.system
        run: nix build --print-build-logs ./infra/home#darwinConfigurations.Jons-MacBook-Pro.system
