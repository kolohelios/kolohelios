name: cascadiajs2026-notes deploy
on:
  pull_request: null
  push:
    branches:
    - main
  workflow_dispatch: null
permissions:
  id-token: write
  contents: read
  pull-requests: write
concurrency:
  group: cascadiajs2026-notes-deploy-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      portfolio: ${{ steps.filter.outputs.portfolio }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - id: base
      run: |
        BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
        if [[ -z "$BASE" || "$BASE" == "0000000000000000000000000000000000000000" ]]; then
          BASE=$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)
        fi
        echo "ref=$BASE" >> "$GITHUB_OUTPUT"
    - uses: dorny/paths-filter@v4
      id: filter
      with:
        base: ${{ steps.base.outputs.ref }}
        filters: |
          portfolio:
            - 'apps/cascadiajs2026-notes/**'
            - '.github/workflows/cascadiajs2026-notes-deploy.yml'
            - '.github/workflows/cf-deploy.yml'
  verify:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.portfolio == 'true' && github.actor != 'dependabot[bot]'
    uses: ./.github/workflows/cf-deploy.yml
    with:
      project_dir: apps/cascadiajs2026-notes
      verify_only: true
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
  preview:
    needs:
    - changes
    - verify
    if: github.event_name == 'pull_request' && needs.changes.outputs.portfolio == 'true' && github.actor != 'dependabot[bot]'
    uses: ./.github/workflows/cf-deploy.yml
    with:
      project_dir: apps/cascadiajs2026-notes
      script_name_override: cascadiajs2026-notes-pr-${{ github.event.pull_request.number }}
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
  comment:
    needs:
    - changes
    - preview
    if: github.event_name == 'pull_request' && needs.changes.outputs.portfolio == 'true' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
    - name: post preview URL comment
      run: |
        body="<!-- preview-deploy:cascadiajs2026-notes -->
        📦 **Preview deploy** for this PR is live at:

        ${WORKER_URL}

        Updates on every push; deleted when the PR closes."
        existing=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
          --jq 'map(select(.body | contains("<!-- preview-deploy:cascadiajs2026-notes -->"))) | .[0].id // empty')
        if [[ -n "$existing" ]]; then
          gh api "repos/$REPO/issues/comments/$existing" -X PATCH -f body="$body"
        else
          gh api "repos/$REPO/issues/$PR_NUMBER/comments" -X POST -f body="$body"
        fi
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        WORKER_URL: ${{ needs.preview.outputs.worker_url }}
  deploy:
    needs: changes
    if: (github.event_name == 'push' && needs.changes.outputs.portfolio == 'true') || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/cf-deploy.yml
    with:
      project_dir: apps/cascadiajs2026-notes
      verify_only: false
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
  gate:
    name: cascadiajs2026-notes deploy gate
    needs:
    - changes
    - verify
    - preview
    - deploy
    if: always()
    runs-on: ubuntu-latest
    steps:
    - run: |-
        echo '${{ toJson(needs) }}' | jq -e '
          to_entries
          | map(select(.value.result != "success" and .value.result != "skipped"))
          | if length == 0 then "Gate passed"
            else error("Gate failed: \(map(.key) | join(", "))")
            end
        '
