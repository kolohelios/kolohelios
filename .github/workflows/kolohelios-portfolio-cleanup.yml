# Delete the ephemeral preview Worker when a PR closes (merged or
# abandoned). Sibling to the generated
# `kolohelios-portfolio-deploy.yml`, which handles verify/preview/
# comment/deploy on open PRs and push:main.
#
# Hand-authored because the wrangler invocation is project-specific
# (script name, working directory, `op run` env-file shape) and the
# `pull_request: closed` trigger doesn't fit the generator's
# `<name>-deploy.yml` shape.
#
# Always runs on PR close; `wrangler delete --force || true` makes
# the call idempotent — a PR that closed before its first preview
# ever deployed just no-ops.
name: kolohelios-portfolio cleanup

on:
  pull_request:
    types: [closed]

permissions:
  id-token: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
    steps:
      - name: verify OP_SERVICE_ACCOUNT_TOKEN
        run: |
          if [[ -z "$OP_SERVICE_ACCOUNT_TOKEN" ]]; then
            echo "::error::OP_SERVICE_ACCOUNT_TOKEN is empty; check repo/org secret"
            exit 1
          fi
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: true
          flakehub: true
      - uses: DeterminateSystems/flakehub-cache-action@v3
      - name: wrangler delete preview Worker
        working-directory: apps/kolohelios-portfolio
        # `--force` skips interactive confirmation; safe because the
        # script name is deterministically derived from the PR
        # number. `|| true` tolerates "not found" — a cleanup
        # running against a PR that never produced a preview
        # (closed before first preview deploy succeeded) shouldn't
        # fail the workflow.
        run: |
          cp .env.example .env
          nix develop . --command op run --env-file=.env -- \
            wrangler delete \
            --name kolohelios-portfolio-pr-${{ github.event.pull_request.number }} \
            --force \
            || true
