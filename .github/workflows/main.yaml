name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # ── Detect changed paths ──────────────────────────────────────
  # Build jobs use these outputs to skip when their inputs haven't
  # changed. The validate job always runs but passes the base ref
  # to `shaka preflight --since` so individual checks self-skip.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      base_ref: ${{ steps.base.outputs.ref }}
      shaka: ${{ steps.filter.outputs.shaka }}
      image: ${{ steps.filter.outputs.image }}
      nix-lib: ${{ steps.filter.outputs.nix-lib }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: base
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [[ -z "$BASE" || "$BASE" == "0000000000000000000000000000000000000000" ]]; then
            BASE=$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)
          fi
          echo "ref=$BASE" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          base: ${{ steps.base.outputs.ref }}
          filters: |
            shaka:
              - 'tools/shaka/**'
              - 'flake.nix'
              - 'flake.lock'
            image:
              - 'infra/devbox/nixos/**'
              - 'flake.nix'
              - 'flake.lock'
            nix-lib:
              - 'nix/kolohelios-nix/**'

  # ── Single gate for branch protection ─────────────────────────
  # `shaka preflight` runs every validation check in one place. CI and
  # local dev invoke the same command so they cannot drift apart.
  validate:
    name: Validate
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      TF_VAR_linode_token: ${{ secrets.LINODE_TOKEN }}
      TF_VAR_root_pass: ${{ secrets.DEVBOX_ROOT_PASS }}
      TF_VAR_image_id: ${{ vars.DEVBOX_IMAGE_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: true
          flakehub: true
      - name: shaka preflight
        run: |
          nix develop --command nix run ./tools/shaka -- preflight \
            --since "${{ needs.changes.outputs.base_ref }}"
      - name: shaka commit lint
        if: github.event_name == 'pull_request'
        run: |
          nix develop --command jj git init --colocate
          nix develop --command nix run ./tools/shaka -- commit lint \
            -r '${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}'

  # ── Build jobs (run after validation, only when inputs change) ─
  build-shaka:
    name: Build shaka
    needs: [validate, changes]
    if: needs.changes.outputs.shaka == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: true
          flakehub: true
      - run: nix build ./tools/shaka
      - uses: DeterminateSystems/flakehub-push@main
        if: github.event_name == 'push'
        with:
          directory: tools/shaka
          name: kolohelios/shaka
          visibility: private
          rolling: true

  build-nix-lib:
    name: Build kolohelios-nix
    needs: [validate, changes]
    if: needs.changes.outputs.nix-lib == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: true
          flakehub: true
      # `nix flake check` forces evaluation of the lib's outputs (lib,
      # formatter, devShells), which seeds the closure that flakehub-push
      # then uploads.
      - run: nix flake check ./nix/kolohelios-nix
      - uses: DeterminateSystems/flakehub-push@main
        if: github.event_name == 'push'
        with:
          directory: nix/kolohelios-nix
          name: kolohelios/kolohelios-nix
          visibility: private
          rolling: true

  build-image:
    name: Build Linode image
    needs: [validate, changes]
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: true
          flakehub: true
      - run: nix build .#linodeImage
      - uses: actions/upload-artifact@v5
        if: github.event_name == 'push'
        with:
          name: linode-image
          path: result/nixos.img
          retention-days: 7
          compression-level: 6

  # ── Required status check ─────────────────────────────────────
  # Branch protection requires only this job. It runs unconditionally
  # and asserts every upstream job finished as success or skipped, so
  # path-filtered jobs can still skip without blocking merge. Every
  # new CI job must add itself to `gate.needs`.
  gate:
    name: Gate
    needs: [changes, validate, build-shaka, build-nix-lib, build-image]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: true
          flakehub: true
      - run: nix run ./tools/shaka -- ci gate --needs '${{ toJson(needs) }}'
