name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Manual trigger from the Actions UI. Useful for forcing publish jobs
  # (build-shaka, build-nix-lib, build-image) to run when path filters
  # would otherwise skip them — e.g. bootstrapping FlakeHub publishing
  # after adding a new project, or republishing without a real code
  # change.
  workflow_dispatch:

# Cancel an in-flight run when a new commit lands on the same PR branch:
# `jj git push` and force-pushes during iteration would otherwise leave the
# previous run churning to completion for nothing. Pushes to `main` never
# cancel — that run gates the next batch of PRs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}

jobs:
  # ── Detect changed paths ──────────────────────────────────────
  # Build jobs use these outputs to skip when their inputs haven't
  # changed. The validate job always runs but passes the base ref
  # to `shaka preflight --since` so individual checks self-skip.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      base_ref: ${{ steps.base.outputs.ref }}
      shaka: ${{ steps.filter.outputs.shaka }}
      image: ${{ steps.filter.outputs.image }}
      nix-lib: ${{ steps.filter.outputs.nix-lib }}
      blogctl: ${{ steps.filter.outputs.blogctl }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: base
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [[ -z "$BASE" || "$BASE" == "0000000000000000000000000000000000000000" ]]; then
            BASE=$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)
          fi
          echo "ref=$BASE" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          base: ${{ steps.base.outputs.ref }}
          filters: |
            shaka:
              - 'tools/shaka/**'
            image:
              - 'infra/devbox/**'
            nix-lib:
              - 'nix/kolohelios-nix/**'
            blogctl:
              - 'apps/blogctl/**'

  # ── Single gate for branch protection ─────────────────────────
  # `shaka preflight` runs every validation check in one place. CI and
  # local dev invoke the same command so they cannot drift apart.
  validate:
    name: Validate
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      TF_VAR_linode_token: ${{ secrets.LINODE_TOKEN }}
      TF_VAR_root_pass: ${{ secrets.DEVBOX_ROOT_PASS }}
      TF_VAR_image_id: ${{ vars.DEVBOX_IMAGE_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: true
          flakehub: true
      - uses: DeterminateSystems/flakehub-cache-action@v3
      # Skip cargo dependency rebuilds when Cargo.lock is unchanged. Only
      # covers the host-side `cargo` invocations from `just validate`; the
      # `nix flake check` path runs in a sandbox actions/cache can't reach.
      - uses: actions/cache@v5
        with:
          path: |
            tools/shaka/target/
            ~/.cargo/registry/
            ~/.cargo/git/
          key: cargo-${{ runner.os }}-${{ hashFiles('tools/shaka/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      # `actions/checkout` produces a git-only tree. shaka's preflight and
      # commit lint both shell out to jj, so colocate before either runs —
      # otherwise `push: main` (which skips commit lint) breaks preflight.
      - name: Colocate jj on the git checkout
        run: nix develop ./tools/shaka --command jj git init --colocate
      - name: shaka commit lint
        if: github.event_name == 'pull_request'
        run: |
          nix develop ./tools/shaka --command tools/shaka/bin/shaka commit lint \
            -r '${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}'
      - name: shaka preflight
        run: |
          nix develop ./tools/shaka --command tools/shaka/bin/shaka preflight \
            --since "${{ needs.changes.outputs.base_ref }}"

  # ── Build jobs ─
  # On pushes (including merges to main) and workflow_dispatch, build
  # jobs always run so FlakeHub publishes never silently skip — the
  # path filter on `changes.outputs.*` is only reliable on PR events,
  # where the base is well-defined. On a rebase-merged push to main,
  # `github.event.before` can resolve to the merge commit itself and
  # the diff comes up empty (see #370). Builds with nothing new are
  # cheap (FlakeHub + nix store cache hit), so the safety is free.
  build-shaka:
    name: Build shaka
    needs: [validate, changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.shaka == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: true
          flakehub: true
      - uses: DeterminateSystems/flakehub-cache-action@v3
      - run: nix build ./tools/shaka
      - uses: DeterminateSystems/flakehub-push@main
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          directory: tools/shaka
          name: kolohelios/shaka
          visibility: public
          rolling: true

  build-blogctl:
    name: Build blogctl
    needs: [validate, changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.blogctl == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: true
          flakehub: true
      - uses: DeterminateSystems/flakehub-cache-action@v3
      - run: nix build ./apps/blogctl
      - uses: DeterminateSystems/flakehub-push@main
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          directory: apps/blogctl
          name: kolohelios/blogctl
          visibility: public
          rolling: true
      # Fire a repository_dispatch at kolohelios/blogs-and-posts so its
      # bump-blogctl workflow runs immediately rather than waiting up
      # to 24h for its daily cron. The kolohelios-bot App already has
      # contents:write on both repos (it's the same identity used by
      # auto-rebase-prs and bump-blogctl in blogs-and-posts), so no
      # new secrets are required.
      - uses: actions/create-github-app-token@v3
        id: bot-token
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          client-id: ${{ vars.KOLOHELIOS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.KOLOHELIOS_BOT_APP_PRIVATE_KEY }}
          owner: kolohelios
          repositories: blogs-and-posts
      - name: Notify blogs-and-posts of new blogctl publish
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          gh api -X POST repos/kolohelios/blogs-and-posts/dispatches \
            -f event_type=blogctl-published

  build-nix-lib:
    name: Build kolohelios-nix
    needs: [validate, changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.nix-lib == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: true
          flakehub: true
      - uses: DeterminateSystems/flakehub-cache-action@v3
      # `nix flake check` forces evaluation of the lib's outputs (lib,
      # formatter, devShells), which seeds the closure that flakehub-push
      # then uploads.
      - run: nix flake check ./nix/kolohelios-nix
      - uses: DeterminateSystems/flakehub-push@main
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          directory: nix/kolohelios-nix
          name: kolohelios/kolohelios-nix
          visibility: public
          rolling: true

  build-image:
    name: Build Linode image
    needs: [validate, changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: true
          flakehub: true
      - uses: DeterminateSystems/flakehub-cache-action@v3
      - run: nix build ./infra/devbox#linodeImage
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          name: linode-image
          path: result/nixos.img
          retention-days: 7
          compression-level: 6

  # ── Required status check ─────────────────────────────────────
  # Branch protection requires only this job. It runs unconditionally
  # and asserts every upstream job finished as success or skipped, so
  # path-filtered jobs can still skip without blocking merge. Every
  # new CI job must add itself to `gate.needs`.
  gate:
    name: Gate
    needs: [changes, validate, build-shaka, build-blogctl, build-nix-lib, build-image]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: true
          flakehub: true
      - uses: DeterminateSystems/flakehub-cache-action@v3
      - run: nix run ./tools/shaka -- ci gate --needs '${{ toJson(needs) }}'
