# Generated by shaka. Do not edit by hand.
# Run `shaka ci generate-workflows` to refresh.
#
# Source of truth: <slot>/<project>/project.cue.

name: CI
on:
  pull_request: null
  push:
    branches:
    - main
  workflow_dispatch: null
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}
jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      aof: ${{ steps.filter.outputs.aof }}
      base_ref: ${{ steps.base.outputs.ref }}
      blogctl: ${{ steps.filter.outputs.blogctl }}
      claude-hooks: ${{ steps.filter.outputs.claude-hooks }}
      home: ${{ steps.filter.outputs.home }}
      image: ${{ steps.filter.outputs.image }}
      nix-lib: ${{ steps.filter.outputs.nix-lib }}
      shaka: ${{ steps.filter.outputs.shaka }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - id: base
      run: |
        BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
        if [[ -z "$BASE" || "$BASE" == "0000000000000000000000000000000000000000" ]]; then
          BASE=$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)
        fi
        echo "ref=$BASE" >> "$GITHUB_OUTPUT"
    - uses: dorny/paths-filter@v4
      id: filter
      with:
        base: ${{ steps.base.outputs.ref }}
        filters: |
          blogctl:
            - 'apps/blogctl/**'
          image:
            - 'infra/devbox/**'
          home:
            - 'infra/home/**'
          nix-lib:
            - 'nix/kolohelios-nix/**'
          aof:
            - 'tools/aof/**'
          claude-hooks:
            - 'tools/claude-hooks/**'
          shaka:
            - 'tools/shaka/**'
  preflight:
    name: Preflight
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      TF_VAR_image_id: ${{ vars.DEVBOX_IMAGE_ID }}
      TF_VAR_linode_token: ${{ secrets.LINODE_TOKEN }}
      TF_VAR_root_pass: ${{ secrets.DEVBOX_ROOT_PASS }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - uses: DeterminateSystems/nix-installer-action@main
      with:
        determinate: true
        flakehub: true
    - uses: DeterminateSystems/flakehub-cache-action@v3
    - uses: actions/cache@v5
      with:
        key: cargo-${{ runner.os }}-${{ hashFiles('tools/shaka/Cargo.lock') }}
        path: |
          tools/shaka/target/
          ~/.cargo/registry/
          ~/.cargo/git/
        restore-keys: cargo-${{ runner.os }}-
    - name: Colocate jj on the git checkout
      run: nix develop ./tools/shaka --command jj git init --colocate
    - name: shaka commit lint
      if: github.event_name == 'pull_request'
      run: |
        nix develop ./tools/shaka --command tools/shaka/bin/shaka commit lint \
          -r '${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}'
    - name: shaka preflight
      run: |
        nix develop ./tools/shaka --command tools/shaka/bin/shaka preflight \
          --since "${{ needs.changes.outputs.base_ref }}"
  build-blogctl:
    name: Build blogctl
    needs:
    - preflight
    - changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.blogctl == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
    - uses: actions/checkout@v6
    - uses: DeterminateSystems/nix-installer-action@main
      with:
        determinate: true
        flakehub: true
    - uses: DeterminateSystems/flakehub-cache-action@v3
    - run: nix build ./apps/blogctl
    - uses: DeterminateSystems/flakehub-push@main
      if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      with:
        directory: apps/blogctl
        name: kolohelios/blogctl
        rolling: true
        visibility: public
    - name: Build blogctl from FlakeHub URL (populate consumer cache)
      if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      run: nix build 'https://flakehub.com/f/kolohelios/blogctl/*.tar.gz'
    - uses: actions/create-github-app-token@v3
      id: bot-token
      if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      with:
        client-id: ${{ vars.KOLOHELIOS_BOT_CLIENT_ID }}
        owner: kolohelios
        private-key: ${{ secrets.KOLOHELIOS_BOT_APP_PRIVATE_KEY }}
        repositories: blogs-and-posts
    - name: Notify blogs-and-posts of new blogctl publish
      if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      run: |
        gh api -X POST repos/kolohelios/blogs-and-posts/dispatches \
          -f event_type=blogctl-published
      env:
        GH_TOKEN: ${{ steps.bot-token.outputs.token }}
  build-image:
    name: Build Linode image
    needs:
    - preflight
    - changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
    - uses: actions/checkout@v6
    - uses: DeterminateSystems/nix-installer-action@main
      with:
        determinate: true
        flakehub: true
    - uses: DeterminateSystems/flakehub-cache-action@v3
    - run: nix build ./infra/devbox#linodeImage
    - uses: actions/upload-artifact@v7
      if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      with:
        compression-level: 6
        name: linode-image
        path: result/nixos.img
        retention-days: 7
  build-home:
    name: Build infra/home
    needs:
    - preflight
    - changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.home == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
    - uses: actions/checkout@v6
    - uses: DeterminateSystems/nix-installer-action@main
      with:
        determinate: true
        flakehub: true
    - uses: DeterminateSystems/flakehub-cache-action@v3
    - run: nix flake check ./infra/home
    - uses: DeterminateSystems/flakehub-push@main
      if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      with:
        directory: infra/home
        name: kolohelios/home
        rolling: true
        visibility: public
  build-nix-lib:
    name: Build kolohelios-nix
    needs:
    - preflight
    - changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.nix-lib == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
    - uses: actions/checkout@v6
    - uses: DeterminateSystems/nix-installer-action@main
      with:
        determinate: true
        flakehub: true
    - uses: DeterminateSystems/flakehub-cache-action@v3
    - run: nix flake check ./nix/kolohelios-nix
    - uses: DeterminateSystems/flakehub-push@main
      if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      with:
        directory: nix/kolohelios-nix
        name: kolohelios/kolohelios-nix
        rolling: true
        visibility: public
  build-aof:
    name: Build aof
    needs:
    - preflight
    - changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.aof == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
    - uses: actions/checkout@v6
    - uses: DeterminateSystems/nix-installer-action@main
      with:
        determinate: true
        flakehub: true
    - uses: DeterminateSystems/flakehub-cache-action@v3
    - run: nix build ./tools/aof
    - uses: DeterminateSystems/flakehub-push@main
      if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      with:
        directory: tools/aof
        name: kolohelios/aof
        rolling: true
        visibility: public
    - name: Build aof from FlakeHub URL (populate consumer cache)
      if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      run: nix build 'https://flakehub.com/f/kolohelios/aof/*.tar.gz'
    - uses: actions/create-github-app-token@v3
      id: bot-token
      if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      with:
        client-id: ${{ vars.KOLOHELIOS_BOT_CLIENT_ID }}
        owner: kolohelios
        private-key: ${{ secrets.KOLOHELIOS_BOT_APP_PRIVATE_KEY }}
        repositories: personal-os
    - name: Notify personal-os of new aof publish
      if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      run: |
        gh api -X POST repos/kolohelios/personal-os/dispatches \
          -f event_type=aof-published
      env:
        GH_TOKEN: ${{ steps.bot-token.outputs.token }}
  build-claude-hooks:
    name: Build claude-hooks
    needs:
    - preflight
    - changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.claude-hooks == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
    - uses: actions/checkout@v6
    - uses: DeterminateSystems/nix-installer-action@main
      with:
        determinate: true
        flakehub: true
    - uses: DeterminateSystems/flakehub-cache-action@v3
    - run: nix build ./tools/claude-hooks
    - uses: DeterminateSystems/flakehub-push@main
      if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      with:
        directory: tools/claude-hooks
        name: kolohelios/claude-hooks
        rolling: true
        visibility: public
  build-shaka:
    name: Build shaka
    needs:
    - preflight
    - changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.shaka == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
    - uses: actions/checkout@v6
    - uses: DeterminateSystems/nix-installer-action@main
      with:
        determinate: true
        flakehub: true
    - uses: DeterminateSystems/flakehub-cache-action@v3
    - run: nix build ./tools/shaka
    - uses: DeterminateSystems/flakehub-push@main
      if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      with:
        directory: tools/shaka
        name: kolohelios/shaka
        rolling: true
        visibility: public
  gate:
    name: Gate
    needs:
    - changes
    - preflight
    - build-blogctl
    - build-image
    - build-home
    - build-nix-lib
    - build-aof
    - build-claude-hooks
    - build-shaka
    if: always()
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
    - uses: actions/checkout@v6
    - uses: DeterminateSystems/nix-installer-action@main
      with:
        determinate: true
        flakehub: true
    - uses: DeterminateSystems/flakehub-cache-action@v3
    - run: nix run ./tools/shaka -- ci gate --needs '${{ toJson(needs) }}'
