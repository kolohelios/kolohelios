name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # ── Single gate for branch protection ─────────────────────────
  # `shaka preflight` runs every validation check in one place. CI and
  # local dev invoke the same command so they cannot drift apart.
  validate:
    name: Validate
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      TF_VAR_linode_token: ${{ secrets.LINODE_TOKEN }}
      TF_VAR_root_pass: ${{ secrets.DEVBOX_ROOT_PASS }}
      TF_VAR_image_id: ${{ vars.DEVBOX_IMAGE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@main
      - name: shaka preflight
        run: nix develop --command nix run ./tools/shaka -- preflight

  # ── Build jobs (run after validation) ─────────────────────────
  build-shaka:
    name: Build shaka
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@main
      - run: nix build ./tools/shaka
      - uses: DeterminateSystems/flakehub-push@main
        if: github.event_name == 'push'
        with:
          directory: tools/shaka
          name: kolohelios/shaka
          visibility: private
          rolling: true

  build-image:
    name: Build Linode image
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@main
      - run: nix build .#linodeImage
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: linode-image
          path: result/nixos.img
          retention-days: 7
          compression-level: 6
