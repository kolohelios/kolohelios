name = "cascadiajs2026-notes"
# `worker-build` produces `build/worker/shim.mjs` and the wasm module
# wrangler uploads. The build runs upstream of `wrangler deploy` (in
# CI: a dedicated step in `cf-deploy.yml`; locally: same command in
# the devshell). Wrangler is invoked with the artifact already in
# place — no `[build]` block, no custom build subprocess. See #403 /
# #423 for why the build is pulled out of the wrangler subprocess.
compatibility_date = "2026-05-01"
main               = "build/worker/shim.mjs"

# Workers Static Assets: CF serves files from `./dist/` directly at
# the edge, bypassing the Worker for matched paths. `dist/` is
# generated by `cargo run --features build-site --bin build-site`
# from `data/talks.cue`, `content/talks/*.md`, `templates/`, and
# `styles/`. The result is committed; CI's `build-check` validate
# step re-runs the pipeline and fails on drift so a content change
# without a regenerate-and-commit can't silently ship.
#
# Unmatched paths fall through to the Worker (`main` above). The
# stub in `src/lib.rs` returns 404 today.
[assets]
directory = "./dist"
