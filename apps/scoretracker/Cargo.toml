[package]
edition      = "2021"
license      = "MIT OR Apache-2.0"
name         = "scoretracker"
publish      = false
rust-version = "1.95"
version      = "0.1.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
# Typed per-module error enums (#640/#654 repo convention) — pure Rust,
# builds on wasm32-unknown-unknown.
snafu = "0.9"
# workers-rs runtime: the fetch entrypoint + the GameState Durable Object.
# Only referenced from the wasm-only `runtime` module, but it builds
# natively too so `cargo test` compiles the crate.
worker = "0.8"

[profile.release]
codegen-units = 1
lto           = true
opt-level     = "s"
strip         = true

[lints.clippy]
mod_module_files = "deny"
