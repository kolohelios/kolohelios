<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>notes</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
    <!-- The notes-sync backend hosts the WebSocket and the OAuth flow. -->
    <script>
      window.NOTES_BACKEND = "notes-sync.kolohelios.com";
    </script>
  </head>
  <body>
    <header class="chrome">
      <h1>notes</h1>
      <span id="status" class="status">connecting…</span>
      <form id="login" class="login">
        <input
          id="handle"
          name="handle"
          placeholder="you.bsky.social"
          autocomplete="username"
          spellcheck="false"
        />
        <button type="submit">sign in</button>
      </form>
      <!-- Shown instead of the login form once `/me` confirms a session. -->
      <span id="account" class="account" hidden></span>
    </header>
    <main>
      <nav id="sidebar" class="sidebar" aria-label="vault">
        <div class="sidebar-head">
          <span>vault</span>
          <button id="new-note" type="button" title="New note">+</button>
        </div>
        <!-- Filled from GET /vault: a tree of the committed notes. -->
        <div id="vault-tree" class="vault-tree">loading…</div>
      </nav>
      <textarea
        id="editor"
        spellcheck="true"
        autofocus
        placeholder="Start typing — every keystroke streams to the server and backs up to git."
      ></textarea>
    </main>

    <!--
      The editing surface and the socket client are the Rust-WASM module
      built from apps/notes-editor. The shell chrome above is plain
      HTML/HTMX; the live document is owned entirely by the WASM editor.
    -->
    <script type="module">
      import init, { start } from "/editor/notes_editor.js";

      const noteId =
        new URLSearchParams(location.search).get("note") || "scratch";
      const wsProto = location.protocol === "https:" ? "wss" : "ws";
      // The notes-sync backend hosts the per-note WebSocket. It is a
      // separate Worker; its host is injected at deploy as
      // `window.NOTES_BACKEND`, defaulting to this origin for local dev.
      const backend = window.NOTES_BACKEND || location.host;
      // The id is a `/`-separated path; the server rejects a percent-encoded
      // slash (`%2F`), so encode each segment but keep the separators raw.
      const wsPath = noteId.split("/").map(encodeURIComponent).join("/");
      const wsUrl = `${wsProto}://${backend}/note/${wsPath}/ws`;

      // Sign in: hand off to the backend's ATProto OAuth login. It
      // resolves the handle, runs the flow, mints the session cookie, and
      // redirects back here.
      document.getElementById("login").addEventListener("submit", (e) => {
        e.preventDefault();
        const handle = document.getElementById("handle").value.trim();
        if (handle) {
          location.href = `https://${backend}/oauth/login?handle=${encodeURIComponent(handle)}`;
        }
      });

      // Auth probe: the session cookie is HttpOnly, so the shell can't read
      // it. Ask the backend `/me` (which can) whether we're signed in, and
      // as whom, then show a signed-in badge instead of the login form.
      async function refreshAuth() {
        const login = document.getElementById("login");
        const account = document.getElementById("account");
        let did;
        try {
          const res = await fetch(`https://${backend}/me`, {
            credentials: "include",
          });
          if (res.ok) ({ did } = await res.json());
        } catch (e) {
          return; // network error — leave the login form as-is
        }
        if (!did) {
          login.hidden = false;
          account.hidden = true;
          return;
        }
        login.hidden = true;
        account.hidden = false;
        account.textContent = "signed in";
        // Best-effort: resolve the DID to a handle for a friendlier label.
        try {
          const doc = await fetch(`https://plc.directory/${did}`).then((r) =>
            r.json(),
          );
          const aka = (doc.alsoKnownAs || []).find((a) =>
            a.startsWith("at://"),
          );
          if (aka) account.textContent = `signed in as @${aka.slice(5)}`;
        } catch (e) {
          /* keep the plain "signed in" label */
        }
      }
      refreshAuth();

      // A note path is `/`-separated unreserved segments — the same shape
      // the backend validates, checked here for instant feedback.
      function validNotePath(p) {
        return (
          p.length > 0 &&
          p
            .split("/")
            .every(
              (s) => /^[A-Za-z0-9._-]+$/.test(s) && s !== "." && s !== "..",
            )
        );
      }

      // Build a nested tree from the flat, sorted note paths so the sidebar
      // can render folders and notes.
      function buildTree(paths) {
        const root = { children: {} };
        for (const p of paths) {
          const parts = p.split("/");
          let node = root;
          parts.forEach((part, i) => {
            node.children[part] ??= { children: {} };
            node = node.children[part];
            if (i === parts.length - 1) node.note = p;
          });
        }
        return root;
      }

      function renderNode(node, container) {
        const ul = document.createElement("ul");
        for (const name of Object.keys(node.children).sort()) {
          const child = node.children[name];
          const li = document.createElement("li");
          if (child.note !== undefined) {
            const a = document.createElement("a");
            a.href = "?note=" + encodeURIComponent(child.note);
            a.textContent = name;
            if (child.note === noteId) a.className = "active";
            li.appendChild(a);
          } else {
            const span = document.createElement("span");
            span.className = "folder";
            span.textContent = name + "/";
            li.appendChild(span);
          }
          if (Object.keys(child.children).length) renderNode(child, li);
          ul.appendChild(li);
        }
        container.appendChild(ul);
      }

      // Load the vault listing and render the sidebar tree. The endpoint is
      // owner-gated, so an unauthenticated visitor sees a prompt to sign in.
      async function loadVault() {
        const tree = document.getElementById("vault-tree");
        let notes;
        try {
          const res = await fetch(`https://${backend}/vault`, {
            credentials: "include",
          });
          if (res.status === 401) {
            tree.textContent = "sign in to see your vault";
            return;
          }
          if (!res.ok) {
            tree.textContent = "vault unavailable";
            return;
          }
          ({ notes } = await res.json());
        } catch (e) {
          tree.textContent = "vault unavailable";
          return;
        }
        tree.replaceChildren();
        if (!notes.length) {
          tree.textContent = "no notes yet";
          return;
        }
        renderNode(buildTree(notes), tree);
      }
      loadVault();

      // New note: navigate to the empty note. It commits to git (and thus
      // joins the vault listing) on its first edit.
      document.getElementById("new-note").addEventListener("click", () => {
        const path = (prompt("New note path (e.g. projects/idea)") || "").trim();
        if (!path) return;
        if (!validNotePath(path)) {
          alert("Use letters, digits, . _ - and / between segments.");
          return;
        }
        location.search = "?note=" + encodeURIComponent(path);
      });

      const status = document.getElementById("status");
      try {
        await init();
        start(wsUrl);
        status.textContent = noteId;
      } catch (e) {
        status.textContent = "editor failed to load";
        console.error(e);
      }
    </script>
  </body>
</html>
