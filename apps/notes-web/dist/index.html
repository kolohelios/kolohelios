<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>notes</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
    <!-- Mermaid renders fenced ```mermaid code blocks in the reading view as
         SVG diagrams — progressive enhancement over the WASM-rendered HTML,
         loaded like HTMX above. The UMD build assigns globalThis.mermaid; if
         it fails to load, the enhancer below no-ops and the raw code block
         shows. (HTMX ships no SRI hash, so neither does this include.) -->
    <script
      src="https://unpkg.com/mermaid@11.16.0/dist/mermaid.min.js"
      defer
    ></script>
    <!-- The notes-sync backend hosts the WebSocket and the OAuth flow. -->
    <script>
      window.NOTES_BACKEND = "notes-sync.kolohelios.com";
    </script>
  </head>
  <body>
    <header class="chrome">
      <h1>notes</h1>
      <span id="status" class="status">connecting…</span>
      <!-- Flips the live surface between the edit textarea and the rendered
           reading view; wired by the WASM editor (apps/notes-editor). -->
      <button
        id="view-toggle"
        type="button"
        class="view-toggle"
        title="Toggle reading view"
      >
        read
      </button>
      <form id="login" class="login">
        <input
          id="handle"
          name="handle"
          placeholder="you.bsky.social"
          autocomplete="username"
          spellcheck="false"
        />
        <button type="submit">sign in</button>
      </form>
      <!-- Shown instead of the login form once `/me` confirms a session. -->
      <span id="account" class="account" hidden></span>
    </header>
    <main>
      <nav id="sidebar" class="sidebar" aria-label="vault">
        <div class="sidebar-head">
          <span>vault</span>
          <button id="new-note" type="button" title="New note">+</button>
        </div>
        <!-- Filled from GET /vault: a tree of the committed notes. -->
        <div id="vault-tree" class="vault-tree">loading…</div>
      </nav>
      <textarea
        id="editor"
        spellcheck="true"
        autofocus
        placeholder="Start typing — every keystroke streams to the server and backs up to git."
      ></textarea>
      <!-- Reading view: the rendered Markdown body. Hidden until the
           view-toggle flips to reading; the WASM editor fills it via
           render_to_html and keeps it live as Syncs land. -->
      <article id="reader" class="reader" hidden></article>
    </main>

    <!--
      The editing surface and the socket client are the Rust-WASM module
      built from apps/notes-editor. The shell chrome above is plain
      HTML/HTMX; the live document is owned entirely by the WASM editor.
    -->
    <script type="module">
      import init, { start } from "/editor/notes_editor.js";

      const noteId =
        new URLSearchParams(location.search).get("note") || "scratch";
      const wsProto = location.protocol === "https:" ? "wss" : "ws";
      // The notes-sync backend hosts the per-note WebSocket. It is a
      // separate Worker; its host is injected at deploy as
      // `window.NOTES_BACKEND`, defaulting to this origin for local dev.
      const backend = window.NOTES_BACKEND || location.host;
      // The id is a `/`-separated path; the server rejects a percent-encoded
      // slash (`%2F`), so encode each segment but keep the separators raw.
      const wsPath = noteId.split("/").map(encodeURIComponent).join("/");
      const wsUrl = `${wsProto}://${backend}/note/${wsPath}/ws`;

      // Sign in: hand off to the backend's ATProto OAuth login. It
      // resolves the handle, runs the flow, mints the session cookie, and
      // redirects back here.
      document.getElementById("login").addEventListener("submit", (e) => {
        e.preventDefault();
        const handle = document.getElementById("handle").value.trim();
        if (handle) {
          location.href = `https://${backend}/oauth/login?handle=${encodeURIComponent(handle)}`;
        }
      });

      // --- Mermaid diagrams in the reading view --------------------------
      // The reading pane (#reader) is filled by the WASM editor via innerHTML;
      // a fenced ```mermaid block arrives as <pre><code class="language-mermaid">
      // (emitted by apps/notes-editor's render_to_html). We render each to SVG
      // here — a progressive enhancement layered on in the shell so the WASM
      // editor stays render-agnostic. Everything degrades to the raw code
      // block: if Mermaid never loaded, or a diagram is invalid, the original
      // <pre><code> is left untouched. Only the reading view is enhanced; the
      // edit textarea keeps showing the raw fenced source.
      const mermaidReady = (() => {
        try {
          if (window.mermaid) {
            // securityLevel:'strict' sanitizes diagram-authored labels/HTML and
            // disables click handlers, so a hostile note can't inject script
            // through a diagram. startOnLoad:false — we drive rendering below.
            window.mermaid.initialize({
              startOnLoad: false,
              securityLevel: "strict",
            });
            return true;
          }
        } catch (e) {
          /* fall through — treat Mermaid as unavailable, show raw blocks */
        }
        return false;
      })();

      let mermaidSeq = 0;
      async function renderMermaid(root) {
        if (!mermaidReady) return; // load/init failed → leave raw code blocks
        for (const code of root.querySelectorAll(
          "pre > code.language-mermaid",
        )) {
          const pre = code.parentElement;
          // Skip already-rendered blocks. The marker is set synchronously
          // before the first await so the re-entrant observer pass (our own
          // SVG swap is a mutation) and any concurrent Sync-driven pass can't
          // double-render the same block.
          if (!pre || pre.dataset.mermaidDone) continue;
          pre.dataset.mermaidDone = "1";
          const source = code.textContent;
          const id = "mermaid-diagram-" + mermaidSeq++;
          try {
            const { svg } = await window.mermaid.render(id, source);
            const figure = document.createElement("figure");
            figure.className = "mermaid";
            figure.innerHTML = svg;
            pre.replaceWith(figure);
          } catch (e) {
            // Invalid diagram: keep the raw <pre><code> (the marker stops a
            // retry loop) and drop any stray node Mermaid left in the DOM.
            document.getElementById(id)?.remove();
            document.getElementById("d" + id)?.remove();
          }
        }
      }

      // Re-render whenever the reading pane's content changes: the WASM editor
      // swaps #reader's innerHTML on toggle-into-reading and on each Sync that
      // lands while reading. Our SVG swap is a childList mutation too, but the
      // dataset marker makes the follow-up pass a no-op, so this can't loop.
      const readerPane = document.getElementById("reader");
      if (readerPane && mermaidReady) {
        new MutationObserver(() => renderMermaid(readerPane)).observe(
          readerPane,
          { childList: true, subtree: true },
        );
        renderMermaid(readerPane); // handle content that's already present
      }

      // Auth probe: the session cookie is HttpOnly, so the shell can't read
      // it. Ask the backend `/me` (which can) whether we're signed in, and
      // as whom, then show a signed-in badge instead of the login form.
      async function refreshAuth() {
        const login = document.getElementById("login");
        const account = document.getElementById("account");
        let did;
        try {
          const res = await fetch(`https://${backend}/me`, {
            credentials: "include",
          });
          if (res.ok) ({ did } = await res.json());
        } catch (e) {
          return; // network error — leave the login form as-is
        }
        if (!did) {
          login.hidden = false;
          account.hidden = true;
          return;
        }
        login.hidden = true;
        account.hidden = false;
        account.textContent = "signed in";
        // Best-effort: resolve the DID to a handle for a friendlier label.
        try {
          const doc = await fetch(`https://plc.directory/${did}`).then((r) =>
            r.json(),
          );
          const aka = (doc.alsoKnownAs || []).find((a) =>
            a.startsWith("at://"),
          );
          if (aka) account.textContent = `signed in as @${aka.slice(5)}`;
        } catch (e) {
          /* keep the plain "signed in" label */
        }
      }
      refreshAuth();

      // A note path is `/`-separated unreserved segments — the same shape
      // the backend validates, checked here for instant feedback.
      function validNotePath(p) {
        return (
          p.length > 0 &&
          p
            .split("/")
            .every(
              (s) => /^[A-Za-z0-9._-]+$/.test(s) && s !== "." && s !== "..",
            )
        );
      }

      // Build a nested tree from the flat, sorted note paths so the sidebar
      // can render folders and notes.
      function buildTree(paths) {
        const root = { children: {} };
        for (const p of paths) {
          const parts = p.split("/");
          let node = root;
          parts.forEach((part, i) => {
            node.children[part] ??= { children: {} };
            node = node.children[part];
            if (i === parts.length - 1) node.note = p;
          });
        }
        return root;
      }

      function renderNode(node, container) {
        const ul = document.createElement("ul");
        for (const name of Object.keys(node.children).sort()) {
          const child = node.children[name];
          const li = document.createElement("li");
          if (child.note !== undefined) {
            const a = document.createElement("a");
            a.href = "?note=" + encodeURIComponent(child.note);
            a.textContent = name;
            if (child.note === noteId) a.className = "active";
            const ren = document.createElement("button");
            ren.type = "button";
            ren.className = "note-act";
            ren.title = "Rename or move note";
            ren.textContent = "✎";
            ren.addEventListener("click", (e) => {
              e.preventDefault();
              e.stopPropagation();
              renameNote(child.note);
            });
            const del = document.createElement("button");
            del.type = "button";
            del.className = "note-act";
            del.title = "Delete note";
            del.textContent = "×";
            del.addEventListener("click", (e) => {
              e.preventDefault();
              e.stopPropagation();
              deleteNote(child.note);
            });
            const row = document.createElement("div");
            row.className = "note-row";
            row.append(a, ren, del);
            li.appendChild(row);
          } else {
            const span = document.createElement("span");
            span.className = "folder";
            span.textContent = name + "/";
            li.appendChild(span);
          }
          if (Object.keys(child.children).length) renderNode(child, li);
          ul.appendChild(li);
        }
        container.appendChild(ul);
      }

      // Load the vault listing and render the sidebar tree. The endpoint is
      // owner-gated, so an unauthenticated visitor sees a prompt to sign in.
      async function loadVault() {
        const tree = document.getElementById("vault-tree");
        let notes;
        try {
          const res = await fetch(`https://${backend}/vault`, {
            credentials: "include",
          });
          if (res.status === 401) {
            tree.textContent = "sign in to see your vault";
            return;
          }
          if (!res.ok) {
            tree.textContent = "vault unavailable";
            return;
          }
          ({ notes } = await res.json());
        } catch (e) {
          tree.textContent = "vault unavailable";
          return;
        }
        tree.replaceChildren();
        if (!notes.length) {
          tree.textContent = "no notes yet";
          return;
        }
        renderNode(buildTree(notes), tree);
      }
      loadVault();

      // Delete a note: confirm, ask the backend to purge it (storage + git
      // file), then refresh. If we just deleted the note we're viewing, fall
      // back to the default note.
      async function deleteNote(note) {
        if (!confirm(`Delete "${note}"? This removes it from git.`)) return;
        try {
          const res = await fetch(
            `https://${backend}/delete?note=${encodeURIComponent(note)}`,
            { method: "POST", credentials: "include" },
          );
          if (!res.ok) {
            alert("Delete failed.");
            return;
          }
        } catch (e) {
          alert("Delete failed.");
          return;
        }
        if (note === noteId) {
          location.search = "?note=scratch";
        } else {
          loadVault();
        }
      }

      // Rename/move a note: prompt for a new path, validate it, ask the
      // backend to move the git file and migrate the Durable Object, then
      // follow the note to its new path (or just refresh the listing).
      async function renameNote(note) {
        const to = (
          prompt(`Rename "${note}" to (new path):`, note) || ""
        ).trim();
        if (!to || to === note) return;
        if (!validNotePath(to)) {
          alert("Use letters, digits, . _ - and / between segments.");
          return;
        }
        // If we're renaming the note we're currently editing, freeze the
        // surface before the move. The server reads the source note's body
        // and then clears its Durable Object; a keystroke landing in that
        // window would be committed to the old path and then erased. Making
        // the textarea read-only stops new edits from being sent; on success
        // we navigate (a full reload), which tears down the live socket.
        const editor = document.getElementById("editor");
        const editingThis = note === noteId;
        if (editingThis) editor.readOnly = true;
        try {
          const res = await fetch(
            `https://${backend}/rename?note=${encodeURIComponent(note)}&to=${encodeURIComponent(to)}`,
            { method: "POST", credentials: "include" },
          );
          if (!res.ok) {
            if (editingThis) editor.readOnly = false;
            let msg;
            if (res.status === 409) {
              // Two distinct 409s: a path collision, vs. the note being open
              // in another tab (refused so an in-flight edit can't be lost).
              // The server's message disambiguates; surface it for the latter
              // so the user knows to close the other tab and retry.
              const body = (await res.text()).trim();
              msg = /open in another tab/i.test(body)
                ? body
                : "A note already exists at that path.";
            } else if (res.status === 404) {
              msg = "That note no longer exists.";
            } else {
              msg = "Rename failed.";
            }
            alert(msg);
            return;
          }
        } catch (e) {
          if (editingThis) editor.readOnly = false;
          alert("Rename failed.");
          return;
        }
        if (editingThis) {
          location.search = "?note=" + encodeURIComponent(to);
        } else {
          loadVault();
        }
      }

      // Ask the backend to auto-file a draft into a folder ("it goes where it
      // goes"). Returns a suggested `folder/slug` path, or "" when auto-filing
      // is disabled (no LLM key), the draft is blank, or anything fails — the
      // caller then falls back to a plain manual prompt. Never throws.
      async function suggestNotePath(draft) {
        if (!draft) return "";
        try {
          const res = await fetch(`https://${backend}/suggest-path`, {
            method: "POST",
            credentials: "include",
            body: draft,
          });
          if (!res.ok) return "";
          const { path } = await res.json();
          return typeof path === "string" ? path : "";
        } catch (e) {
          return "";
        }
      }

      // New note: optionally describe it so the LLM can auto-file it into the
      // right folder, then confirm/edit the path and navigate to the empty
      // note. It commits to git (and thus joins the vault listing) on its
      // first edit. Auto-filing is a convenience layered over the manual path
      // entry: a blank description, a disabled LLM, or any failure degrades to
      // the plain path prompt.
      document
        .getElementById("new-note")
        .addEventListener("click", async () => {
          const draft = (
            prompt(
              "What's the note about? (used to auto-file it — leave blank to set the path yourself)",
            ) || ""
          ).trim();
          const suggested = await suggestNotePath(draft);
          const path = (
            prompt("New note path (e.g. projects/idea)", suggested) || ""
          ).trim();
          if (!path) return;
          if (!validNotePath(path)) {
            alert("Use letters, digits, . _ - and / between segments.");
            return;
          }
          location.search = "?note=" + encodeURIComponent(path);
        });

      const status = document.getElementById("status");
      try {
        await init();
        start(wsUrl);
        status.textContent = noteId;
      } catch (e) {
        status.textContent = "editor failed to load";
        console.error(e);
      }
    </script>
  </body>
</html>
