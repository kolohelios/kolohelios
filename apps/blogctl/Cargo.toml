[package]
name = "blogctl"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "blogctl"
path = "src/lib.rs"

[[bin]]
name = "blogctl"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
thiserror = "1"
time = { version = "0.3", features = ["formatting", "parsing", "serde", "serde-well-known", "macros"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"
