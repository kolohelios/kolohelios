[package]
edition = "2021"
license = "MIT OR Apache-2.0"
name    = "blogctl"
publish = false
version = "0.1.0"

[lib]
name = "blogctl"
path = "src/lib.rs"

[[bin]]
name = "blogctl"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
humantime = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
thiserror = "1"
time = { version = "0.3", features = [
  "formatting",
  "parsing",
  "serde",
  "serde-well-known",
  "macros",
] }
toml = "0.8"
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
mockito  = "1"
tempfile = "3"

[lints.clippy]
mod_module_files = "deny"
