name = "kolohelios-portfolio"
# `worker-build` produces `build/worker/shim.mjs` and the wasm module
# wrangler uploads. The build runs upstream of `wrangler deploy` (in
# CI: a dedicated step in `cf-deploy.yml`; locally: same command in
# the devshell). Wrangler is invoked with the artifact already in
# place — no `[build]` block, no custom build subprocess. See #403 /
# #423: when `worker-build` runs inside a wrangler-spawned subprocess
# (the documented workers-rs idiom), `wasm-pack`'s wasm-target probe
# does `which("rustc")` against whatever `$PATH` wrangler hands it,
# which in our CI ends up resolving to a rustc that isn't the one we
# declared in the devshell. Pulling the build out of wrangler keeps
# the probe inside a process whose `$PATH` we control.
compatibility_date = "2026-05-01"
main               = "build/worker/shim.mjs"

# Workers Static Assets: CF serves files from `./dist/` directly at
# the edge, bypassing the Worker for matched paths. Cache rules
# (managed by `infra/cloudflare-deploy`) apply to these responses,
# so the catch-all HTML rule from #190 finally engages — without
# this block, Worker-generated responses never enter the cache
# phase and the ruleset no-ops.
#
# `dist/` is generated by `cargo run --features build-site --bin
# build-site` from `templates/`, `data/`, and `styles/`. The result
# is committed; CI's `build-check` validate step (in the generated
# justfile) re-runs the pipeline and fails on drift so a template
# change without a regenerate-and-commit can't silently ship.
#
# Unmatched paths fall through to the Worker (`main` above). The
# `/api/subscribe` handler in `src/lib.rs` proxies the contact and
# newsletter forms to Kit; everything else 404s.
[assets]
directory = "./dist"

# Non-secret runtime config the worker reads via `env.var(...)`. These
# are Kit form ids (safe to commit — they're embedded in public Kit
# forms), one per submission `kind`. Replace the placeholders with the
# real form ids; see README "Kit setup". KIT_API_KEY is a *secret*, set
# out-of-band via `wrangler secret put KIT_API_KEY` (not committed here).
[vars]
KIT_FORM_ID_CONTACT    = "REPLACE_WITH_CONTACT_FORM_ID"
KIT_FORM_ID_NEWSLETTER = "REPLACE_WITH_NEWSLETTER_FORM_ID"

# Cloudflare native rate limiting. The worker calls this binding
# (`SUBSCRIBE_RATE_LIMITER`) per client IP in `handle_subscribe`; over
# the limit returns 429 before any Kit call. `namespace_id` is an
# arbitrary unique id for this limiter; `period` must be 10 or 60.
[[unsafe.bindings]]
name         = "SUBSCRIBE_RATE_LIMITER"
type         = "ratelimit"
namespace_id = "1001"
simple       = { limit = 5, period = 60 }
