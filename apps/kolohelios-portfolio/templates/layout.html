<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}kolohelios{% endblock %}</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="min-h-screen bg-stone-50 text-stone-900 dark:bg-stone-950 dark:text-stone-100">
<header class="border-b border-stone-200 dark:border-stone-800">
  <nav class="mx-auto flex max-w-3xl items-center justify-between px-6 py-4">
    <a href="/" class="font-semibold tracking-tight hover:text-stone-600 dark:hover:text-stone-400">kolohelios</a>
    <ul class="flex gap-6 text-sm">
      <li><a href="/about" class="hover:text-stone-600 dark:hover:text-stone-400">about</a></li>
      <li><a href="/work" class="hover:text-stone-600 dark:hover:text-stone-400">work</a></li>
      <li><a href="/projects" class="hover:text-stone-600 dark:hover:text-stone-400">projects</a></li>
    </ul>
  </nav>
</header>
<main class="mx-auto max-w-3xl px-6 py-12">
{% block content %}{% endblock %}
</main>
<footer class="border-t border-stone-200 mt-16 dark:border-stone-800">
  <div class="mx-auto max-w-3xl px-6 py-6 text-xs text-stone-500 dark:text-stone-500">
    <p>&copy; Jon Edwards &middot; <a href="https://github.com/kolohelios" class="hover:text-stone-700 dark:hover:text-stone-300">github</a></p>
  </div>
</footer>
</body>
</html>
