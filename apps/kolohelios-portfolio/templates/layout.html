<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}kolohelios{% endblock %}</title>
<link rel="stylesheet" href="/style.css">
<!-- Cloudflare Web Analytics (privacy-respecting, cookieless). Token is a
     public site identifier issued by the cloudflare_web_analytics_site in
     infra/cloudflare-deploy; see README "Web analytics". -->
<script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "6562146fec4c422499fd5fffb1d6a230"}'></script>
</head>
<body class="min-h-screen bg-[var(--bg)] text-[color:var(--fg-strong)]">
<header class="border-b border-[color:var(--border)]">
  <nav class="mx-auto flex max-w-3xl items-center justify-between px-6 py-4">
    <a href="/" class="font-semibold tracking-tight hover:text-[color:var(--fg-muted)]">kolohelios</a>
    <ul class="flex gap-6 text-sm">
      <li><a href="/about" class="hover:text-[color:var(--fg-muted)]">about</a></li>
      <li><a href="/work" class="hover:text-[color:var(--fg-muted)]">work</a></li>
      <li><a href="/projects" class="hover:text-[color:var(--fg-muted)]">projects</a></li>
      <li><a href="/resume" class="hover:text-[color:var(--fg-muted)]">résumé</a></li>
      <li><a href="/contact" class="hover:text-[color:var(--fg-muted)]">contact</a></li>
    </ul>
  </nav>
</header>
<main class="mx-auto max-w-3xl px-6 py-12">
{% block content %}{% endblock %}
</main>
<footer class="border-t border-[color:var(--border)] mt-16">
  <div class="mx-auto max-w-3xl px-6 py-6 text-xs text-[color:var(--fg-faint)]">
    <p>&copy; Jon Edwards &middot; <a href="https://github.com/kolohelios" class="hover:text-[color:var(--fg)]">github</a></p>
  </div>
</footer>
</body>
</html>
