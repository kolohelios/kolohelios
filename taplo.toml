# Generated Wrangler files are checked by shaka deploy generate-wrangler.
exclude = [
  "tools/shaka/tests/fixtures/**",
  "**/target/**",
  "apps/kolohelios-portfolio/wrangler.toml",
  "apps/pollen-alert/wrangler.toml",
]
include = ["**/*.toml"]

[formatting]
align_entries = true
column_width  = 80
indent_string = "  "
reorder_keys  = true
